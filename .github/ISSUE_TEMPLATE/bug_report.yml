name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. **Remove API keys, tokens and personal data from anything you paste here.**
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Run ...
        2. Open ...
        3. Click ...
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How are you running it?
      options:
        - npx local-ai-gateway
        - From source (npm run dev or npm start)
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The npm package version (npx local-ai-gateway --version), or the commit if you run from source.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Provider or tool involved
      description: For example Groq, Google AI Studio, Claude Code, Codex, ChatGPT in the browser.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: With npx they are in ~/.local-ai-gateway/logs (on Windows %USERPROFILE%\.local-ai-gateway\logs). Keys and tokens removed, please.
      render: shell
