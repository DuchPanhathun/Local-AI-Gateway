name: package

# `npx local-ai-gateway` has to run on Linux, macOS and Windows. The launcher's tests and a smoke
# test (stand-in programs, no build) run on every change to the package. To run the PUBLISHED
# package for real on all three, start this by hand with its version (Actions > package > Run workflow).

on:
  push:
    paths:
      - "packaging/**"
      - "scripts/build-package.mjs"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build-package.mjs"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Published version of local-ai-gateway to run for real on every system (blank: skip)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  launcher:
    name: launcher, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: node --test
        working-directory: packaging/local-ai-gateway
      - name: Smoke test, start to stop, with stand-in programs
        run: node packaging/tests/smoke.mjs

  node20:
    name: unit tests on Node 20, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test
        working-directory: packaging/local-ai-gateway

  published:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
    name: published ${{ github.event.inputs.version }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch and unpack the published package
        shell: bash
        run: |
          mkdir published
          cd published
          npm pack "local-ai-gateway@$VERSION"
          tar -xzf local-ai-gateway-*.tgz
      - name: The patched gateways against real processes
        shell: bash
        env:
          LOCAL_AI_GATEWAY_GATEWAYS: ${{ github.workspace }}/published/package/gateways
        run: |
          python -m pip install --disable-pip-version-check psutil playwright
          python -m unittest discover packaging/tests -v
      - name: The package, run for real
        shell: bash
        run: node packaging/tests/real.mjs --package published/package
